name: Database integration

on:
  push:
    branches: ["**"]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - ".github/scripts/**"
      - ".github/workflows/integration.yml"
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - ".github/scripts/**"
      - ".github/workflows/integration.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: database-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run SQLite workflow
        run: go test ./integration -run TestSQLiteDriverWorkflow -count=1 -v

      - name: Run SQLite driver conformance
        run: go test ./pkg/database/sqlite -run TestSQLiteLiveConformance -count=1 -v

  postgres:
    name: PostgreSQL ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ["14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: rolling
          POSTGRES_PASSWORD: rolling
          POSTGRES_DB: rolling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rolling -d rolling"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run PostgreSQL workflow
        env:
          RT_INTEGRATION_POSTGRES: "1"
          RT_DATABASE_HOST: 127.0.0.1
          RT_DATABASE_PORT: "5432"
          RT_DATABASE_USER: rolling
          RT_DATABASE_PASSWORD: rolling
          RT_DATABASE_NAME: rolling
        run: go test ./integration -run TestPostgreSQLDriverWorkflow -count=1 -v

      - name: Run PostgreSQL driver conformance
        env:
          ROLLINGTHUNDER_POSTGRES_TEST_HOST: 127.0.0.1
          ROLLINGTHUNDER_POSTGRES_TEST_PORT: "5432"
          ROLLINGTHUNDER_POSTGRES_TEST_USER: rolling
          ROLLINGTHUNDER_POSTGRES_TEST_PASSWORD: rolling
          ROLLINGTHUNDER_POSTGRES_TEST_DATABASE: rolling
          ROLLINGTHUNDER_POSTGRES_TEST_SSL_MODE: disable
          ROLLINGTHUNDER_TEST_PRIVILEGED: "1"
        run: go test ./pkg/database/postgres -run TestPostgresLiveConformance -count=1 -v

      - name: Configure required PostgreSQL TLS
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_TLS_FIXTURES: ${{ github.workspace }}/.database-ci-tls/postgres
          POSTGRES_TLS_CLIENT_ROLE: rolling_tls
        run: >-
          bash .github/scripts/configure-postgres-tls.sh
          "$POSTGRES_SERVICE_CONTAINER"
          "$POSTGRES_TLS_FIXTURES"
          "$POSTGRES_TLS_CLIENT_ROLE"

      - name: Run PostgreSQL TLS conformance
        env:
          ROLLINGTHUNDER_POSTGRES_TEST_HOST: 127.0.0.1
          ROLLINGTHUNDER_POSTGRES_TEST_PORT: "5432"
          ROLLINGTHUNDER_POSTGRES_TEST_USER: rolling
          ROLLINGTHUNDER_POSTGRES_TEST_PASSWORD: rolling
          ROLLINGTHUNDER_POSTGRES_TEST_DATABASE: rolling
          ROLLINGTHUNDER_POSTGRES_TEST_REQUIRE_TLS: "1"
          ROLLINGTHUNDER_POSTGRES_TEST_TLS_SERVER_NAME: localhost
          ROLLINGTHUNDER_POSTGRES_TEST_TLS_ROOT_CERT: ${{ github.workspace }}/.database-ci-tls/postgres/ca-cert.pem
          ROLLINGTHUNDER_POSTGRES_TEST_TLS_WRONG_ROOT_CERT: ${{ github.workspace }}/.database-ci-tls/postgres/wrong-ca-cert.pem
          ROLLINGTHUNDER_POSTGRES_TEST_TLS_CLIENT_CERT: ${{ github.workspace }}/.database-ci-tls/postgres/client-cert.pem
          ROLLINGTHUNDER_POSTGRES_TEST_TLS_CLIENT_KEY: ${{ github.workspace }}/.database-ci-tls/postgres/client-key.pem
          ROLLINGTHUNDER_POSTGRES_TEST_TLS_CLIENT_ROLE: rolling_tls
        run: go test ./pkg/database/postgres -run TestPostgresTLSLiveConformance -count=1 -v

      - name: Run PostgreSQL driver conformance over verified TLS
        env:
          ROLLINGTHUNDER_POSTGRES_TEST_HOST: 127.0.0.1
          ROLLINGTHUNDER_POSTGRES_TEST_PORT: "5432"
          ROLLINGTHUNDER_POSTGRES_TEST_USER: rolling
          ROLLINGTHUNDER_POSTGRES_TEST_PASSWORD: rolling
          ROLLINGTHUNDER_POSTGRES_TEST_DATABASE: rolling
          ROLLINGTHUNDER_POSTGRES_TEST_SSL_MODE: verify-full
          ROLLINGTHUNDER_POSTGRES_TEST_SSL_ROOT_CERT: ${{ github.workspace }}/.database-ci-tls/postgres/ca-cert.pem
          ROLLINGTHUNDER_POSTGRES_TEST_TLS_SERVER_NAME: localhost
          ROLLINGTHUNDER_TEST_PRIVILEGED: "1"
        run: go test ./pkg/database/postgres -run TestPostgresLiveConformance -count=1 -v

  mysql-compatible:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.0 (legacy compatibility)
            image: mysql:8.0
            driver: mysql
            health_command: mysqladmin ping -h 127.0.0.1 -uroot -prolling --silent
          - name: MySQL 8.4 LTS
            image: mysql:8.4
            driver: mysql
            health_command: mysqladmin ping -h 127.0.0.1 -uroot -prolling --silent
          - name: MySQL 9.7 LTS
            image: mysql:9.7
            driver: mysql
            health_command: mysqladmin ping -h 127.0.0.1 -uroot -prolling --silent
          - name: MariaDB 10.11 LTS
            image: mariadb:10.11
            driver: mariadb
            health_command: healthcheck.sh --connect --innodb_initialized
          - name: MariaDB 11.4 LTS
            image: mariadb:11.4
            driver: mariadb
            health_command: healthcheck.sh --connect --innodb_initialized
          - name: MariaDB 11.8 LTS
            image: mariadb:11.8
            driver: mariadb
            health_command: healthcheck.sh --connect --innodb_initialized
          - name: MariaDB 12.3 LTS
            image: mariadb:12.3
            driver: mariadb
            health_command: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: rolling
          MYSQL_DATABASE: rolling
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health_command }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 18
          --health-start-period 15s
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run MySQL-compatible workflow
        env:
          RT_INTEGRATION_MYSQL: "1"
          RT_DATABASE_DRIVER: ${{ matrix.driver }}
          RT_DATABASE_HOST: 127.0.0.1
          RT_DATABASE_PORT: "3306"
          RT_DATABASE_USER: root
          RT_DATABASE_PASSWORD: rolling
          RT_DATABASE_NAME: rolling
        run: go test ./integration -run TestMySQLCompatibleDriverWorkflow -count=1 -v

      - name: Run MySQL-compatible driver conformance
        env:
          ROLLINGTHUNDER_MYSQL_TEST_HOST: 127.0.0.1
          ROLLINGTHUNDER_MYSQL_TEST_PORT: "3306"
          ROLLINGTHUNDER_MYSQL_TEST_USER: root
          ROLLINGTHUNDER_MYSQL_TEST_PASSWORD: rolling
          ROLLINGTHUNDER_MYSQL_TEST_DATABASE: rolling
          ROLLINGTHUNDER_MYSQL_TEST_SSL_MODE: disable
          ROLLINGTHUNDER_TEST_PRIVILEGED: "1"
        run: go test ./pkg/database/mysql -run TestMySQLLiveConformance -count=1 -v

      - name: Configure required MySQL-compatible TLS
        env:
          MYSQL_SERVICE_CONTAINER: ${{ job.services.database.id }}
          MYSQL_TLS_FIXTURES: ${{ github.workspace }}/.database-ci-tls/mysql
          MYSQL_TLS_CLIENT_USER: rolling_tls
        run: >-
          bash .github/scripts/configure-mysql-tls.sh
          "$MYSQL_SERVICE_CONTAINER"
          "$MYSQL_TLS_FIXTURES"
          "$MYSQL_TLS_CLIENT_USER"

      - name: Run MySQL-compatible TLS conformance
        env:
          ROLLINGTHUNDER_MYSQL_TEST_HOST: 127.0.0.1
          ROLLINGTHUNDER_MYSQL_TEST_PORT: "3306"
          ROLLINGTHUNDER_MYSQL_TEST_USER: root
          ROLLINGTHUNDER_MYSQL_TEST_PASSWORD: rolling
          ROLLINGTHUNDER_MYSQL_TEST_DATABASE: rolling
          ROLLINGTHUNDER_MYSQL_TEST_REQUIRE_TLS: "1"
          ROLLINGTHUNDER_MYSQL_TEST_TLS_SERVER_NAME: localhost
          ROLLINGTHUNDER_MYSQL_TEST_TLS_ROOT_CERT: ${{ github.workspace }}/.database-ci-tls/mysql/ca-cert.pem
          ROLLINGTHUNDER_MYSQL_TEST_TLS_WRONG_ROOT_CERT: ${{ github.workspace }}/.database-ci-tls/mysql/wrong-ca-cert.pem
          ROLLINGTHUNDER_MYSQL_TEST_TLS_CLIENT_CERT: ${{ github.workspace }}/.database-ci-tls/mysql/client-cert.pem
          ROLLINGTHUNDER_MYSQL_TEST_TLS_CLIENT_KEY: ${{ github.workspace }}/.database-ci-tls/mysql/client-key.pem
          ROLLINGTHUNDER_MYSQL_TEST_TLS_CLIENT_USER: rolling_tls
        run: go test ./pkg/database/mysql -run TestMySQLTLSLiveConformance -count=1 -v

      - name: Run MySQL-compatible driver conformance over verified TLS
        env:
          ROLLINGTHUNDER_MYSQL_TEST_HOST: 127.0.0.1
          ROLLINGTHUNDER_MYSQL_TEST_PORT: "3306"
          ROLLINGTHUNDER_MYSQL_TEST_USER: root
          ROLLINGTHUNDER_MYSQL_TEST_PASSWORD: rolling
          ROLLINGTHUNDER_MYSQL_TEST_DATABASE: rolling
          ROLLINGTHUNDER_MYSQL_TEST_SSL_MODE: verify-full
          ROLLINGTHUNDER_MYSQL_TEST_SSL_ROOT_CERT: ${{ github.workspace }}/.database-ci-tls/mysql/ca-cert.pem
          ROLLINGTHUNDER_MYSQL_TEST_TLS_SERVER_NAME: localhost
          ROLLINGTHUNDER_TEST_PRIVILEGED: "1"
        run: go test ./pkg/database/mysql -run TestMySQLLiveConformance -count=1 -v

  sql-server:
    name: SQL Server ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RT_INTEGRATION_SQLSERVER: "1"
      RT_DATABASE_HOST: 127.0.0.1
      RT_DATABASE_PORT: "1433"
      RT_DATABASE_USER: sa
      RT_DATABASE_PASSWORD: "RollingThunder_2026!"
      RT_DATABASE_NAME: master
      RT_DATABASE_SCHEMA: dbo
      RT_DATABASE_SSL_MODE: disable
      ROLLINGTHUNDER_SQLSERVER_TEST_HOST: 127.0.0.1
      ROLLINGTHUNDER_SQLSERVER_TEST_PORT: "1433"
      ROLLINGTHUNDER_SQLSERVER_TEST_USER: sa
      ROLLINGTHUNDER_SQLSERVER_TEST_PASSWORD: "RollingThunder_2026!"
      ROLLINGTHUNDER_SQLSERVER_TEST_DATABASE: master
      ROLLINGTHUNDER_SQLSERVER_TEST_SSL_MODE: disable
      ROLLINGTHUNDER_SQLSERVER_TEST_BACKUP: "1"
      ROLLINGTHUNDER_TEST_PRIVILEGED: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "2022"
            image: mcr.microsoft.com/mssql/server:2022-latest
          - version: "2025"
            # Pin the live TDS 8 fixture to a real database image. The current
            # 2025-latest registry reference can resolve to lifecycle metadata.
            image: mcr.microsoft.com/mssql/server:2025-CU7-ubuntu-22.04
    services:
      database:
        image: ${{ matrix.image }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "RollingThunder_2026!"
        ports:
          - 1433:1433
        options: >-
          --hostname sqlserver.test
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'RollingThunder_2026!' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 20s
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run SQL Server workflow
        run: go test ./integration -run TestSQLServerDriverWorkflow -count=1 -v

      - name: Run SQL Server driver conformance
        run: go test ./pkg/database/sqlserver -run TestSQLServerLiveConformance -count=1 -v

      - name: Configure required SQL Server TLS
        env:
          SQLSERVER_SERVICE_CONTAINER: ${{ job.services.database.id }}
          SQLSERVER_TLS_FIXTURES: ${{ github.workspace }}/.database-ci-tls/sqlserver
        run: >-
          bash .github/scripts/configure-sqlserver-tls.sh
          "$SQLSERVER_SERVICE_CONTAINER"
          "$SQLSERVER_TLS_FIXTURES"

      - name: Run SQL Server TLS conformance
        env:
          ROLLINGTHUNDER_SQLSERVER_TEST_REQUIRE_TLS: "1"
          ROLLINGTHUNDER_SQLSERVER_TEST_TLS_SERVER_NAME: localhost
          ROLLINGTHUNDER_SQLSERVER_TEST_TLS_ROOT_CERT: ${{ github.workspace }}/.database-ci-tls/sqlserver/ca-cert.pem
          ROLLINGTHUNDER_SQLSERVER_TEST_TLS_WRONG_ROOT_CERT: ${{ github.workspace }}/.database-ci-tls/sqlserver/wrong-ca-cert.pem
        run: go test ./pkg/database/sqlserver -run TestSQLServerTLSLiveConformance -count=1 -v

      - name: Run SQL Server driver conformance over verified TLS
        env:
          ROLLINGTHUNDER_SQLSERVER_TEST_SSL_MODE: verify-full
          ROLLINGTHUNDER_SQLSERVER_TEST_SSL_ROOT_CERT: ${{ github.workspace }}/.database-ci-tls/sqlserver/ca-cert.pem
          ROLLINGTHUNDER_SQLSERVER_TEST_TLS_SERVER_NAME: localhost
        run: go test ./pkg/database/sqlserver -run TestSQLServerLiveConformance -count=1 -v

      # SQL Server 2022 Linux accepts verified TLS over TDS 7.4 but rejects
      # client-requested TDS 8.0. SQL Server 2025 Linux is the required live
      # fixture for Strict protocol negotiation.
      - name: Run SQL Server TDS 8.0 Strict TLS conformance
        if: matrix.version == '2025'
        env:
          ROLLINGTHUNDER_SQLSERVER_TEST_REQUIRE_TLS: "1"
          ROLLINGTHUNDER_SQLSERVER_TEST_TDS8_STRICT: "1"
          ROLLINGTHUNDER_SQLSERVER_TEST_TLS_SERVER_NAME: localhost
          ROLLINGTHUNDER_SQLSERVER_TEST_TLS_ROOT_CERT: ${{ github.workspace }}/.database-ci-tls/sqlserver/ca-cert.pem
          ROLLINGTHUNDER_SQLSERVER_TEST_TLS_WRONG_ROOT_CERT: ${{ github.workspace }}/.database-ci-tls/sqlserver/wrong-ca-cert.pem
        run: >-
          go test ./pkg/database/sqlserver
          -run 'TestSQLServerTLSLiveConformance/strict'
          -count=1 -v

      - name: Run SQL Server driver conformance over TDS 8.0 Strict
        if: matrix.version == '2025'
        env:
          ROLLINGTHUNDER_SQLSERVER_TEST_SSL_MODE: strict
          ROLLINGTHUNDER_SQLSERVER_TEST_SSL_ROOT_CERT: ${{ github.workspace }}/.database-ci-tls/sqlserver/ca-cert.pem
          ROLLINGTHUNDER_SQLSERVER_TEST_TLS_SERVER_NAME: localhost
        run: go test ./pkg/database/sqlserver -run TestSQLServerLiveConformance -count=1 -v

  oracle:
    name: Oracle Database Free
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RT_INTEGRATION_ORACLE: "1"
      RT_DATABASE_HOST: 127.0.0.1
      RT_DATABASE_PORT: "1521"
      RT_DATABASE_USER: system
      RT_DATABASE_PASSWORD: "RollingThunder_2026"
      RT_DATABASE_NAME: FREEPDB1
      RT_DATABASE_SCHEMA: SYSTEM
      RT_DATABASE_SSL_MODE: disable
      ROLLINGTHUNDER_ORACLE_TEST_HOST: 127.0.0.1
      ROLLINGTHUNDER_ORACLE_TEST_PORT: "1521"
      ROLLINGTHUNDER_ORACLE_TEST_USER: system
      ROLLINGTHUNDER_ORACLE_TEST_PASSWORD: "RollingThunder_2026"
      ROLLINGTHUNDER_ORACLE_TEST_SERVICE: FREEPDB1
      ROLLINGTHUNDER_ORACLE_TEST_SSL_MODE: disable
      ROLLINGTHUNDER_ORACLE_TEST_PRIVILEGED: "1"
      ROLLINGTHUNDER_ORACLE_TEST_REQUIRE_SECURE: "1"
      ROLLINGTHUNDER_ORACLE_TEST_TLS_PORT: "2484"
      ROLLINGTHUNDER_ORACLE_TEST_TLS_SERVER_NAME: localhost
      ROLLINGTHUNDER_ORACLE_TEST_TLS_ROOT_CERT: ${{ github.workspace }}/.oracle-ci-wallet/server-cert.pem
      ROLLINGTHUNDER_ORACLE_TEST_WALLET_PATH: ${{ github.workspace }}/.oracle-ci-wallet
      ROLLINGTHUNDER_ORACLE_TEST_WALLET_PASSWORD_FILE: ${{ github.workspace }}/.oracle-ci-wallet/wallet-password
      ORACLE_STABILITY_REPETITIONS: "3"
    services:
      database:
        # Data Pump and DBMS_METADATA require XDB, which Oracle's lite image
        # deliberately omits. Pin the full multi-architecture image so CI
        # cannot silently move to an incompatible database build.
        image: container-registry.oracle.com/database/free:23.26.0.0
        env:
          ORACLE_PWD: "RollingThunder_2026"
        ports:
          - 1521:1521
          - 2484:2484
        options: >-
          --shm-size=1g
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Configure Oracle TCPS and test Wallet
        env:
          ORACLE_SERVICE_CONTAINER: ${{ job.services.database.id }}
        run: >-
          bash .github/scripts/configure-oracle-tcps.sh
          "$ORACLE_SERVICE_CONTAINER"
          "$ROLLINGTHUNDER_ORACLE_TEST_WALLET_PATH"
          "$ROLLINGTHUNDER_ORACLE_TEST_TLS_PORT"

      - name: Run Oracle workflow
        run: go test ./integration -run TestOracleDriverWorkflow -count=1 -v

      - name: Run required Oracle stable conformance
        run: go test ./pkg/database/oracle -run TestOracleLiveConformance -count=1 -v

      - name: Repeat Oracle stable conformance
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: >-
          go test ./pkg/database/oracle
          -run TestOracleLiveConformance
          -count="$ORACLE_STABILITY_REPETITIONS"
          -v

      - name: Run extended Oracle Data Pump conformance
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          ROLLINGTHUNDER_ORACLE_TEST_DATAPUMP: "1"
        run: go test ./pkg/database/oracle -run TestOracleDataPumpLiveConformance -count=1 -v
