name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION_FILE: go.mod
  NODE_VERSION: "22"
  WAILS_VERSION: v2.10.1

jobs:
  validate:
    name: Release validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must use semantic versioning, for example v1.2.3"
            exit 1
          fi

      - name: Test backend
        run: go test ./...

      - name: Run race detector
        run: go test -race ./internal/db ./internal/diagnostics ./pkg/database/...

      - name: Vet backend
        run: go vet ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require signing credentials for tag releases
        if: github.event_name == 'push'
        run: |
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"

      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          KEYCHAIN_PASSWORD: rollingthunder-ci-keychain
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/rollingthunder.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/rollingthunder-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Set package version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: node .github/scripts/set-release-version.mjs "$RELEASE_VERSION"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Build application
        run: wails build -clean -m -nocolour -trimpath -platform darwin/${{ matrix.arch }} -o rollingthunder

      - name: Sign application
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        run: |
          shopt -s nullglob
          APPS=(build/bin/*.app)
          test "${#APPS[@]}" -eq 1
          APP_PATH="${APPS[0]}"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package and optionally notarize
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="manual-${GITHUB_RUN_NUMBER}"
          fi
          shopt -s nullglob
          APPS=(build/bin/*.app)
          test "${#APPS[@]}" -eq 1
          APP_PATH="${APPS[0]}"
          mkdir -p dist
          ARCHIVE="dist/rollingthunder_${VERSION}_darwin_${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE"
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            xcrun notarytool submit "$ARCHIVE" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            xcrun stapler staple "$APP_PATH"
            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE"
          fi

      - name: Upload macOS package
        uses: actions/upload-artifact@v6
        with:
          name: rollingthunder-darwin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows amd64
    needs: validate
    # Windows 2022 retains the NSIS toolchain required by Wails v2 packaging.
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require signing credentials for tag releases
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { throw "WINDOWS_CERTIFICATE_BASE64 is required" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw "WINDOWS_CERTIFICATE_PASSWORD is required" }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set package version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: node .github/scripts/set-release-version.mjs "$env:RELEASE_VERSION"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build NSIS installer
        run: wails build -clean -m -nocolour -trimpath -platform windows/amd64 -nsis -o rollingthunder.exe

      - name: Sign and stage installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path build/bin -Filter "*installer*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Wails NSIS installer was not produced" }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "rollingthunder.pfx"
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signTool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
            if (-not $signTool) {
              $kitsRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
              $signTool = Get-ChildItem "$kitsRoot\*\x64\signtool.exe" |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $signTool) { throw "signtool.exe was not found" }
            & $signTool sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
            & $signTool verify /pa /v $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed" }
          }
          $version = if ($env:GITHUB_EVENT_NAME -eq "push") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            "manual-$env:GITHUB_RUN_NUMBER"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $installer.FullName "dist/rollingthunder_${version}_windows_amd64_installer.exe"

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: rollingthunder-windows-amd64
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux amd64
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require signing credentials for tag releases
        if: github.event_name == 'push'
        run: |
          test -n "$LINUX_GPG_PRIVATE_KEY_BASE64"
          test -n "$LINUX_GPG_PASSPHRASE"

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set package version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: node .github/scripts/set-release-version.mjs "$RELEASE_VERSION"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Build application
        run: wails build -clean -m -nocolour -trimpath -tags webkit2_41 -platform linux/amd64 -o rollingthunder

      - name: Package application
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="manual-${GITHUB_RUN_NUMBER}"
          fi
          mkdir -p dist/package
          install -m 0755 build/bin/rollingthunder dist/package/rollingthunder
          install -m 0644 README.md LICENSE dist/package/
          tar -C dist/package -czf "dist/rollingthunder_${VERSION}_linux_amd64.tar.gz" .
          rm -rf dist/package

      - name: Sign Linux package
        if: env.LINUX_GPG_PRIVATE_KEY_BASE64 != ''
        run: |
          echo "$LINUX_GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
          PACKAGE="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$LINUX_GPG_PASSPHRASE" \
            --armor --detach-sign "$PACKAGE"
          gpg --verify "${PACKAGE}.asc" "$PACKAGE"

      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: rollingthunder-linux-amd64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v6
        with:
          pattern: rollingthunder-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v6
        with:
          name: rollingthunder-release
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
